<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Kosztów Przetrwania i Budżetu Domowego</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; padding: 24px 16px; }
    .container { max-width: 1050px; margin: 0 auto; }
    header { margin-bottom: 18px; text-align: center; }
    h1 { font-size: 1.85rem; font-weight: 800; color: #0f172a; }
    p.subtitle { color: #64748b; margin-top: 4px; font-size: 0.95rem; }

    /* Zakładki */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 2px;
      overflow-x: auto;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #1e293b; background: #e2e8f0; }
    .tab-btn.active {
      color: #2563eb;
      border-bottom: 3px solid #2563eb;
      background: #ffffff;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 860px) { .grid { grid-template-columns: 1.1fr 0.9fr; } }

    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-bottom: 20px; }
    h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; color: #1e293b; display: flex; align-items: center; justify-content: space-between; }
    
    label { display: block; font-size: 0.85rem; font-weight: 500; color: #475569; margin-bottom: 4px; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .input-group { position: relative; margin-bottom: 12px; }
    input[type="number"], input[type="text"], input[type="month"], select {
      width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; background: #fff;
    }
    input:focus, select:focus { border-color: #2563eb; ring: 2px solid #93c5fd; }
    .suffix { position: absolute; right: 10px; top: 9px; color: #94a3b8; font-weight: 600; font-size: 0.8rem; }

    .goal-banner {
      background: #ecfdf5;
      border: 2px solid #10b981;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
    }
    .goal-banner input { width: 20px; height: 20px; margin-top: 2px; cursor: pointer; }
    .goal-banner-text strong { display: block; color: #065f46; font-size: 0.95rem; }
    .goal-banner-text p { font-size: 0.8rem; color: #047857; margin-top: 2px; }

    .sync-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sync-banner label { margin: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #1e40af; font-weight: 600; }

    .checkbox-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; cursor: pointer; }
    .checkbox-box input { width: 18px; height: 18px; cursor: pointer; }
    .checkbox-box span { font-size: 0.85rem; font-weight: 600; color: #334155; }

    .excel-import-box {
      border: 2px dashed #93c5fd;
      background-color: #eff6ff;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .excel-import-box:hover { background-color: #dbeafe; }
    .excel-import-box label { cursor: pointer; color: #1d4ed8; font-weight: 600; display: block; }
    .excel-import-box span.hint { font-size: 0.75rem; color: #64748b; }
